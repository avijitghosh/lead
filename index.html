<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#070d1f;--card:#101a38;--line:#22305a;--tx:#e8edff;--mut:#8b98c4;--blue:#2f6bff;--pur:#8b5cf6;--grad:linear-gradient(135deg,#2f6bff,#8b5cf6);--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

textarea.inp{min-height:130px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px;font-weight:600}
.card{background:linear-gradient(180deg,rgba(20,32,66,.85),rgba(14,23,50,.85));border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}

.side nav button:hover{background:rgba(47,107,255,.12);color:var(--tx)}.side nav button.on{background:var(--grad);color:#fff}
main{flex:1;min-width:0}.top{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,13,31,.85);backdrop-filter:blur(10px);z-index:20}.top h1{font-size:19px;flex:1}.menu{display:none}
.view{padding:24px 28px;animation:up .4s ease;max-width:1300px}@keyframes up{from{opacity:0;transform:translateY(10px)}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}.tbl{width:100%;border-collapse:collapse;min-width:860px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:10px 12px;background:#0b1431;white-space:nowrap}.tbl th.s{cursor:pointer}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap}.tbl tbody tr{cursor:pointer;transition:.15s}.tbl tbody tr:hover{background:rgba(47,107,255,.1)}
.sc,.bdg{padding:2px 10px;border-radius:99px;font-weight:700;font-size:12px;display:inline-block}.sc.hi,.bdg.ok{background:rgba(34,197,94,.15);color:#4ade80}.sc.mid,.bdg.warn{background:rgba(245,158,11,.15);color:#fbbf24}.sc.lo,.bdg.bad{background:rgba(239,68,68,.15);color:#f87171}.bdg.in{background:rgba(47,107,255,.18);color:#93b4ff}
.bars{display:flex;align-items:flex-end;gap:12px;height:160px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:var(--grad);border-radius:8px 8px 0 0;animation:gr .8s ease;transform-origin:bottom}@keyframes gr{from{transform:scaleY(0)}}
.hb{margin:9px 0}.hb p{display:flex;justify-content:space-between;font-size:13px}.hb u{display:block;height:8px;border-radius:9px;background:#0a1330;margin-top:4px;overflow:hidden}.hb u i{display:block;height:100%;background:var(--grad);animation:gw .8s ease}@keyframes gw{from{width:0!important}}
.empty{padding:30px;text-align:center;color:var(--mut)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}.row>.btn{flex:none}
.chip{display:inline-block;background:#0a1330;border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin:2px;font-size:12px}
.ov{position:fixed;inset:0;background:rgba(3,6,18,.7);backdrop-filter:blur(4px);z-index:60;display:grid;place-items:center;padding:16px}.mod{background:#0e1735;border:1px solid var(--line);border-radius:18px;padding:24px;max-width:560px;width:100%;max-height:88vh;overflow:auto;position:relative;animation:up .25s}.x{position:absolute;right:14px;top:12px;background:0;border:0;cursor:pointer;color:var(--mut)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--grad);padding:11px 20px;border-radius:12px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:.3s;max-width:90vw}#toast.on{opacity:1}
.note{border-left:3px solid var(--warn);background:rgba(245,158,11,.08);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
.lp{max-width:1150px;margin:auto;padding:0 22px}.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0}.hero{text-align:center;padding:70px 0 40px}.hero h1{font-size:clamp(36px,6vw,68px);line-height:1.05;letter-spacing:-.03em;font-weight:800}.hero p{font-size:18px;color:var(--mut);max-width:620px;margin:20px auto 28px}
.mock{max-width:860px;margin:30px auto 0;animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth .card{max-width:400px;width:100%}
.feat{transition:.25s}.feat:hover{transform:translateY(-4px);border-color:var(--pur)}.feat .ic{font-size:26px}
@media(max-width:860px){.side{position:fixed;left:-260px;transition:.25s}.side.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}.menu{display:inline-flex}.view{padding:18px 14px}.top{padding:12px 14px}.g2{grid-template-columns:1fr}}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:auto}@keyframes sp{to{transform:rotate(360deg)}}
#busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--grad);z-index:90;opacity:0;transform-origin:left;transition:opacity .2s}#busy.on{opacity:1;animation:bz 1.2s ease-in-out infinite}@keyframes bz{0%{transform:scaleX(0)}60%{transform:scaleX(.85)}100%{transform:scaleX(1)}}
.note.bad{border-color:var(--bad);background:rgba(239,68,68,.08)}
</style></head><body><div id="app"></div><div id="modal"></div><div id="toast"></div><div id="busy"></div>

<script>
/* ===== Data layer: Supabase Auth + public.leads. Scoring settings and import history stay in localStorage per user. ===== */
const Store={get(k,d){try{const v=localStorage.getItem('lb_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('lb_'+k,JSON.stringify(v))}catch(e){}}};
const DEF={q:60,kw:'sales,marketing,growth,revenue,partnership,business development',loc:'usa,united states,uk,canada,germany',w:{exec:40,vp:34,dir:26,mgr:16,ic:6,kw:15,loc:10,email:15,phone:8,li:7,co:5}};
const SEED=["Sarah Mitchell|VP of Sales|Northwind Analytics|Austin, USA|+1 555 0101|sarah-mitchell-demo|Demo CSV","Daniel Okafor|Director of Marketing|Brightpath Logistics|London, UK|+44 555 0102|daniel-okafor-demo|Demo CSV","Priya Nair|Chief Executive Officer|Lumen Health|Toronto, Canada||priya-nair-demo|Demo LinkedIn URL","Marcus Weber|Head of Growth|Stackwise GmbH|Berlin, Germany|+49 555 0104|marcus-weber-demo|Demo CSV","Elena Rossi|Marketing Manager|Cobalt Retail|Milan, Italy||elena-rossi-demo|Demo Manual","James Carter|Sales Development Rep|Helix Cloud|Denver, USA|+1 555 0106|james-carter-demo|Demo CSV","Aisha Rahman|Founder|Tidewater Studio|Dhaka, Bangladesh|NOEMAIL|aisha-rahman-demo|Demo LinkedIn URL","Tom Becker|Software Engineer|Orbit Systems|Seattle, USA||tom-becker-demo|Demo Manual","Mei Lin|Director of Partnerships|Vantage Fintech|Singapore|+65 555 0109|mei-lin-demo|Demo CSV","Carlos Mendes|Revenue Operations Manager|Aurora Energy|Austin, USA|+1 555 0110|carlos-mendes-demo|Demo LinkedIn URL","Hannah Lee|Business Development Manager|Skyline Freight|Vancouver, Canada||hannah-lee-demo|Demo Manual","Oliver Grant|Chief Marketing Officer|Pinecrest Software|London, UK|+44 555 0112|oliver-grant-demo|Demo CSV"];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={user:null,leads:[],imports:[],cfg:JSON.parse(JSON.stringify(DEF)),ready:false,starting:false};
function score(l,c=S.cfg){const w=c.w,t=(l.title||'').toLowerCase(),R=[];let n=0;const add=(k,p)=>{n+=p;R.push([k,p])};
if(/chief|\bc[a-z]o\b|founder|owner|president/.test(t))add('C-level / founder',w.exec);else if(/\bvp\b|vice president|head of/.test(t))add('VP / Head of',w.vp);else if(/director/.test(t))add('Director',w.dir);else if(/manager|lead/.test(t))add('Manager / Lead',w.mgr);else if(t)add('Individual contributor',w.ic);
if(c.kw.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).some(k=>t.includes(k)))add('Title matches target role',w.kw);
const lo=(l.location||'').toLowerCase();if(c.loc.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).some(k=>lo.includes(k)))add('Target location',w.loc);
if(l.email)add('Email supplied',w.email);if(l.phone)add('Phone supplied',w.phone);if(l.linkedin)add('LinkedIn URL supplied',w.li);if(l.company)add('Company supplied',w.co);
l.score=Math.min(100,n);l.reasons=R;return l.score}
/* --- Supabase configuration: paste your Project URL and PUBLISHABLE key below. Never put a service_role / secret key in frontend code. --- */
const SUPABASE_URL='https://akqxapytcpeuadfmjxyf.supabase.co'.replace(/\/+$/,''),SUPABASE_KEY='sb_publishable_9WF-JFURYNvn3YomvTEmRg_e11ZTn8y';
const isSecret=k=>/^sb_secret_/.test(k)||(()=>{try{return JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role==='service_role'}catch(e){return false}})();
const CONFIGURED=/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(SUPABASE_URL)&&!/YOUR-PROJECT-REF/.test(SUPABASE_URL)&&SUPABASE_KEY.length>20&&!/^YOUR_/.test(SUPABASE_KEY)&&!isSecret(SUPABASE_KEY);
let sb=null; /* single Supabase client, created once */
if(CONFIGURED&&window.supabase){try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){console.error(e)}}
const needSb=()=>sb?true:(toast(CONFIGURED?'Could not load the Supabase SDK. Check your connection.':'Supabase is not configured. Add your URL and publishable key at the top of the script.'),false);
const COLS='id,owner_id,full_name,job_title,company,location,email,phone,linkedin_url,source,lead_score,notes,created_at,updated_at',CR=/(?:^|\n)Consent source: (.+)/;
const fromRow=r=>{const m=(r.notes||'').match(CR),l={id:r.id,name:r.full_name||'',title:r.job_title||'',company:r.company||'',location:r.location||'',email:r.email||'',phone:r.phone||'',linkedin:r.linkedin_url||'',source:r.source||'Manual entry',notes:(r.notes||'').replace(CR,'').trim(),consent:m?m[1]:'Supplied by user',added:(r.created_at||'').slice(0,10),_s:r.lead_score};score(l);return l};
const toRow=l=>({full_name:l.name,job_title:l.title||null,company:l.company||null,location:l.location||null,email:l.email||null,phone:l.phone||null,linkedin_url:l.linkedin||null,source:l.source||'Manual entry',lead_score:l.score,notes:[l.notes,l.consent&&l.consent!=='Supplied by user'?'Consent source: '+l.consent:''].filter(Boolean).join('\n')||null});
async function insertLeads(arr){const out=[];for(let i=0;i<arr.length;i+=200){const rows=arr.slice(i,i+200).map(l=>({...toRow(l),owner_id:S.user.id}));const{data,error}=await sb.from('leads').insert(rows).select(COLS);if(error)throw error;const got=data.map(fromRow);S.leads.push(...got);out.push(...got)}return out}
async function updateLead(id,n){const{data,error}=await sb.from('leads').update(toRow(n)).eq('id',id).eq('owner_id',S.user.id).select(COLS);if(error)throw error;if(!data||!data.length)throw new Error('Update was not permitted or the lead no longer exists.');const i=S.leads.findIndex(x=>x.id==id);S.leads[i]=fromRow(data[0]);return S.leads[i]}
async function loadLeads(){const out=[];for(let f=0;;f+=1000){const{data,error}=await sb.from('leads').select(COLS).eq('owner_id',S.user.id).order('created_at',{ascending:false}).range(f,f+999);if(error)throw error;out.push(...data);if(data.length<1000)break}S.leads=out.map(fromRow)}
const userFrom=u=>({id:u.id,email:u.email,name:(u.user_metadata&&u.user_metadata.full_name)||(u.email||'user').split('@')[0]});
function loadLocal(){const u=S.user.id;S.cfg=Store.get('cfg_'+u,null)||JSON.parse(JSON.stringify(DEF));S.cfg.w={...DEF.w,...S.cfg.w};S.imports=Store.get('imports_'+u,[])}
async function startSession(u){S.user=userFrom(u);loadLocal();try{await loadLeads()}catch(e){S.leads=[];console.error(e);toast(fe(e))}}
const save=()=>{if(S.user){Store.set('cfg_'+S.user.id,S.cfg);Store.set('imports_'+S.user.id,S.imports)}};
function fe(e){const m=(e&&e.message)||String(e);if(/failed to fetch|network|load failed/i.test(m))return'Network problem. Check your connection and try again.';if(/invalid login/i.test(m))return'Incorrect email or password.';if(/already registered/i.test(m))return'An account with this email already exists. Try logging in.';if(/email not confirmed/i.test(m))return'Please confirm your email first. Check your inbox.';if(/rate limit|too many/i.test(m))return'Too many attempts. Please wait a minute and try again.';if(e&&e.code=='23505')return'A lead with these details already exists.';if(/row-level security|permission denied/i.test(m))return'The database security rules blocked this action.';if(/schema cache|does not exist|column/i.test(m))return'Database table or column mismatch. Check that public.leads has the expected columns.';if(/jwt|session/i.test(m))return'Your session expired. Please log in again.';return m}
let BZ=0;const withBusy=async f=>{BZ++;$('#busy').className='on';try{return await f()}catch(e){console.error(e);toast(fe(e))}finally{if(!--BZ)$('#busy').className=''}};
const demoLeads=()=>SEED.map((s,i)=>{const p=s.split('|'),first=p[0].split(' ')[0].toLowerCase(),dom=p[2].toLowerCase().replace(/[^a-z]/g,'')+'-demo.example',no=p[4]==='NOEMAIL'||[2,4,7,10].includes(i);return{name:p[0],title:p[1],company:p[2],location:p[3],email:no?'':first+'@'+dom,phone:p[4]==='NOEMAIL'?'':p[4],linkedin:'https://www.linkedin.com/in/'+p[5],source:'Demo data',consent:'Demo data'}});
const emptyCard=()=>S.leads.length?'':`<div class="card"><h3>Your lead database is empty</h3><p class="mut sm">Import leads, add one manually, or load a few clearly fake sample leads into your account to explore the app.</p><div class="row" style="margin-top:12px"><button class="btn g" onclick="A.go('csv')">Import CSV / Excel</button><button class="btn" onclick="A.seed()">Load sample leads</button></div></div>`;

const NAV=[['dash','Dashboard','📊'],['finder','Lead Finder','🔎'],['linkedin','LinkedIn Import','🔗'],['csv','CSV / Excel Import','📄'],['db','Lead Database','🗂️'],['scoring','AI Lead Scoring','🎯'],['insights','Lead Insights','💡'],['enrich','Contact Enrichment','✨'],['export','Export Center','📤'],['account','Settings','⚙️']];

function tbl(list,o={}){if(!list.length)return'<div class="empty">No leads match.</div>';const H=[['name','Name'],['title','Job Title'],['company','Company'],['location','Location'],['email','Email'],['phone','Phone'],['score','Lead Score'],['source','Source']];
return`<div class="tw"><table class="tbl"><thead><tr>${o.sel?'<th><input type="checkbox" onchange="A.all(this.checked)"></th>':''}${H.map(h=>`<th ${o.sort?`class="s" onclick="A.sort('${h[0]}')"`:''}>${h[1]}${o.sort&&D.sort==h[0]?(D.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${list.map(l=>`<tr onclick="A.view('${l.id}')">${o.sel?`<td onclick="event.stopPropagation()"><input type="checkbox" ${D.sel.has(l.id)?'checked':''} onchange="A.pick('${l.id}',this.checked)"></td>`:''}<td><b>${esc(l.name)}</b></td><td>${esc(l.title)||'—'}</td><td>${esc(l.company)||'—'}</td><td>${esc(l.location)||'—'}</td><td>${esc(l.email)||'<span class="mut">—</span>'}</td><td>${esc(l.phone)||'<span class="mut">—</span>'}</td><td>${pill(l)}</td><td><span class="bdg in">${esc(l.source)}</span></td></tr>`).join('')}</tbody></table></div>`}

const count=(L,f)=>{const o={};L.forEach(l=>{const k=f(l);if(k)o[k]=(o[k]||0)+1});return Object.fromEntries(Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,6))};

const V={};
V.home=()=>`<div class="lp"><div class="nav"><div class="logo">${LOGO}</div><div class="row" style="flex:none"><button class="btn" onclick="A.go('login')">Log in</button><button class="btn g" onclick="A.go('signup')">Start free</button></div></div>

/* ===== Import engine ===== */
let ST=[];const LI=/^https?:\/\/([a-z]{2,3}\.)?linkedin\.com\/in\/([\w\-%]{3,100})\/?(\?.*)?$/i,EM=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const nrm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const same=(a,b)=>(a.email&&b.email&&nrm(a.email)==nrm(b.email))||(a.linkedin&&b.linkedin&&a.linkedin==b.linkedin)||(a.name&&b.name&&a.company&&b.company&&nrm(a.name)==nrm(b.name)&&nrm(a.company)==nrm(b.company));
function fin(r){['name','title','company','location','email','phone','linkedin'].forEach(k=>r[k]=(r[k]||'').toString().trim());r.err=[];
if(r.linkedin){const m=r.linkedin.replace(/[,;.)]+$/,'').match(LI);if(m){r.linkedin='https://www.linkedin.com/in/'+m[2].toLowerCase();if(!r.name){r.name=m[2].replace(/-[0-9a-f]{6,}$/i,'').split('-').filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');r.note='Name derived from URL slug — verify'}}else r.err.push('Invalid LinkedIn URL')}
if(r.email&&!EM.test(r.email))r.err.push('Invalid email');if(!r.name)r.err.push('Missing name');return r}
function fromLine(line,src){const r={source:src};let s=line;const em=s.match(/[^\s,;|]+@[^\s,;|]+/);if(em){r.email=em[0];s=s.replace(em[0],'')}const li=s.match(/\S*linkedin\S*/i);if(li){r.linkedin=li[0];s=s.replace(li[0],'')}else if(/^https?:\/\//i.test(line.trim())){r.linkedin=line.trim();s=''}
const ph=s.match(/\+?\d[\d\s().-]{7,}\d/);if(ph){r.phone=ph[0].trim();s=s.replace(ph[0],'')}
const p=s.split(/[|\t;]/.test(s)?/[|\t;]/:/,/).map(x=>x.trim()).filter(Boolean);[r.name,r.title,r.company,r.location]=p;
if(r.title&&!r.company&&/ at /i.test(r.title)){const q=r.title.split(/ at /i);r.title=q[0];r.company=q[1]}return fin(r)}
const FP=[['email',/e-?mail/i],['phone',/phone|mobile|tel/i],['linkedin',/linkedin|profile|url/i],['first',/first/i],['last',/last|surname/i],['title',/title|position|role|job/i],['company',/company|organi[sz]ation|employer/i],['location',/location|city|country|region|address/i],['name',/name/i]];
function mapRow(o,src){const f={};for(const k in o){const v=String(o[k]??'').trim();if(!v)continue;const m=FP.find(p=>p[1].test(k));if(m&&!f[m[0]])f[m[0]]=v}return fin({source:src,name:f.name||[f.first,f.last].filter(Boolean).join(' '),title:f.title,company:f.company,location:f.location,email:f.email,phone:f.phone,linkedin:f.linkedin})}
function parseCSV(t){const d=[',',';','\t'].sort((a,b)=>t.split('\n')[0].split(b).length-t.split('\n')[0].split(a).length)[0];const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}
const rr=rows.filter(x=>x.some(y=>y.trim()));const h=(rr.shift()||[]).map(x=>x.trim());return rr.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]])))}
function stage(rows,label){ST=rows;ST.label=label;ST.forEach((r,i)=>{r.dup=S.leads.some(x=>same(r,x))?'existing lead':ST.slice(0,i).some(x=>same(r,x))?'repeated in import':''});prev()}
function prev(){const el=$('#prev');if(!el)return;if(!ST.length){el.innerHTML='';return}const bad=ST.filter(r=>r.err.length).length,dup=ST.filter(r=>!r.err.length&&r.dup).length,ok=ST.length-bad-dup;
el.innerHTML=`<div class="card"><h3>Import preview — ${esc(ST.label)}</h3><div class="row" style="margin-bottom:12px"><span class="bdg ok">${ok} new</span><span class="bdg warn">${dup} duplicates</span><span class="bdg bad">${bad} invalid</span><label style="margin:0;flex:none"><input type="checkbox" id="skipd" checked> Skip duplicates</label></div><div class="tw" style="max-height:380px"><table class="tbl"><thead><tr><th>Name</th><th>Job Title</th><th>Company</th><th>Location</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead><tbody>${ST.map(r=>`<tr style="cursor:default"><td><b>${esc(r.name)||'—'}</b>${r.note?`<br><small class="mut">${r.note}</small>`:''}</td><td>${esc(r.title)||'—'}</td><td>${esc(r.company)||'—'}</td><td>${esc(r.location)||'—'}</td><td>${esc(r.email)||'—'}</td><td>${esc(r.phone)||'—'}</td><td>${r.err.length?`<span class="bdg bad">${r.err.join(', ')}</span>`:r.dup?`<span class="bdg warn">Duplicate: ${r.dup}</span>`:'<span class="bdg ok">New</span>'}</td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:14px"><button class="btn g" onclick="A.commit()">Save to lead database</button><button class="btn" onclick="ST=[];prev()">Discard</button></div></div>`}
A.commit=async()=>{const skip=$('#skipd').checked,ok=ST.filter(r=>!r.err.length&&(!skip||!r.dup));if(!ok.length)return toast('Nothing to save');
await withBusy(async()=>{const arr=ok.map(r=>{const l={name:r.name,title:r.title,company:r.company,location:r.location,email:r.email,phone:r.phone,linkedin:r.linkedin,source:r.source,consent:'Supplied by importer'};score(l);return l});
try{var saved=await insertLeads(arr)}catch(e){await loadLeads().catch(()=>{});throw e}
S.imports.unshift({id:'i'+Date.now(),name:ST.label,type:ST[0].source,added:saved.length,dups:ST.filter(r=>r.dup).length,invalid:ST.filter(r=>r.err.length).length,date:new Date().toISOString().slice(0,10)});save();toast(saved.length+' leads saved to your account');ST=[];A.go('db')})};

A.file=f=>{if(!f)return;const n=f.name,ex=/\.xlsx?$/i.test(n),rd=new FileReader();rd.onerror=()=>toast('Could not read file');
if(ex){if(typeof XLSX=='undefined')return toast('Excel parser unavailable — export as CSV instead');rd.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});stage(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}).map(o=>mapRow(o,'Excel')),n)}catch(x){toast('Invalid Excel file')}};rd.readAsArrayBuffer(f)}

V.scoring=()=>{const c=S.cfg,W=[['exec','C-level / founder'],['vp','VP / Head of'],['dir','Director'],['mgr','Manager / Lead'],['ic','Individual contributor'],['kw','Title matches target role'],['loc','Target location'],['email','Email supplied'],['phone','Phone supplied'],['li','LinkedIn URL supplied'],['co','Company supplied']];
return`<div class="note"><b>Not machine learning.</b> This is a transparent, rule-based points system (max 100). Every point is explained, and you control the weights. A real AI/ML model could replace it later.</div><div class="grid g2"><div class="card"><h3>Scoring rules</h3>${W.map(w=>`<div class="row" style="margin:6px 0"><span>${w[1]}</span><input class="inp" type="number" min="0" max="100" style="max-width:90px;flex:none" value="${c.w[w[0]]}" onchange="A.w('${w[0]}',this.value)"></div>`).join('')}<label>Target role keywords (comma separated)</label><input class="inp" value="${esc(c.kw)}" onchange="S.cfg.kw=this.value;A.rescore()"><label>Target locations (comma separated)</label><input class="inp" value="${esc(c.loc)}" onchange="S.cfg.loc=this.value;A.rescore()"><label>Qualified threshold</label><input class="inp" type="number" value="${c.q}" onchange="S.cfg.q=+this.value;A.rescore()"></div>
<div class="card"><h3>Top leads and why</h3>${[...S.leads].sort((a,b)=>b.score-a.score).slice(0,8).map(l=>`<div style="margin:10px 0"><b>${esc(l.name)}</b> ${pill(l)}<br>${l.reasons.map(r=>`<span class="chip">${r[0]} +${r[1]}</span>`).join('')}</div>`).join('')}</div></div>`};
A.w=(k,v)=>{S.cfg.w[k]=Math.max(0,+v||0);A.rescore()};A.rescore=async()=>{S.leads.forEach(l=>score(l));save();render();const ch=S.leads.filter(l=>l._s!==l.score);await withBusy(async()=>{for(let i=0;i<ch.length;i+=20)await Promise.all(ch.slice(i,i+20).map(async l=>{const{error}=await sb.from('leads').update({lead_score:l.score}).eq('id',l.id).eq('owner_id',S.user.id);if(error)throw error;l._s=l.score}))});toast('Scores recalculated'+(ch.length?' and saved':''))};
V.insights=()=>{const L=S.leads,vp=L.filter(l=>/chief|\bc[a-z]o\b|founder|owner|president|\bvp\b|vice president|head of|director/i.test(l.title)),ready=vp.filter(l=>l.email),noE=L.filter(l=>!l.email).length,noP=L.filter(l=>!l.phone).length,loc=count(L,l=>(l.location||'').split(',').pop().trim()),top=Object.entries(loc)[0];
const sen=count(L,l=>(l.reasons.find(r=>/level|VP|Director|Manager|Individual/.test(r[0]))||[])[0]),n=L.length||1;
return`<div class="note">Insights are computed from the fields in your database using fixed rules. They describe your data; they are not predictions.</div><div class="card"><h3>Potential customer insights</h3><ul style="padding-left:18px;display:grid;gap:8px"><li><b>${ready.length}</b> decision-makers (Director and above) already have an email on file — a natural outreach shortlist.</li><li><b>${noE}</b> leads lack an email and <b>${noP}</b> lack a phone — candidates for consent-based enrichment.</li>${top?`<li>Largest region in your data: <b>${esc(top[0])}</b> (${top[1]} leads).</li>`:''}<li><b>${L.filter(l=>l.score>=S.cfg.q).length}</b> of ${L.length} leads meet your qualified threshold of ${S.cfg.q}.</li></ul></div>
<div class="grid g2"><div class="card"><h3>Seniority mix</h3>${hb(sen,Math.max(1,...Object.values(sen)))}</div><div class="card"><h3>Top companies</h3>${hb(count(L,l=>l.company),2)}</div><div class="card"><h3>Regions</h3>${hb(loc,Math.max(1,...Object.values(loc)))}</div><div class="card"><h3>Data completeness</h3>${hb({Email:Math.round(100*(n-noE)/n),Phone:Math.round(100*(n-noP)/n),LinkedIn:Math.round(100*L.filter(l=>l.linkedin).length/n)},100)}</div></div>
<div class="card"><h3>Prospect summary generator</h3><select class="inp" onchange="$('#sm').textContent=this.value?summary(S.leads.find(l=>l.id==this.value)):''"><option value="">Choose a lead…</option>${L.map(l=>`<option value="${l.id}">${esc(l.name)} — ${esc(l.company)}</option>`).join('')}</select><p id="sm" style="margin-top:12px"></p><p class="mut sm">Template-based text built from supplied fields only.</p></div>`};
V.enrich=()=>{const L=S.leads.filter(l=>!l.email||!l.phone);return`<div class="note"><b>Authorized sources only.</b> LeadBridge never looks up, guesses or generates contact details. Add a value only if you obtained it from the person, a consent-based form, or a licensed provider you are authorized to use—and record where it came from.</div><div class="grid g2"><div class="card"><h3>Authorized enrichment paths</h3><ul style="padding-left:18px;display:grid;gap:6px" class="sm"><li>Manual entry of details the contact gave you (below)</li><li>Re-import a CSV from your CRM or opt-in forms</li><li>Licensed data-provider connector — <span class="bdg warn">planned (Supabase edge function)</span></li></ul></div><div class="card"><h3>Consent request template</h3><p class="sm mut">Hi {name}, we’d like to keep in touch about {topic}. May we store your email and phone for that purpose? Reply YES to opt in; you can opt out at any time.</p><button class="btn sm" style="margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText('Hi {name}, we’d like to keep in touch about {topic}. May we store your email and phone for that purpose? Reply YES to opt in; you can opt out at any time.');toast('Template copied')">Copy template</button></div></div>
<div class="card"><h3>Leads with missing details (${L.length})</h3>${L.length?L.map(l=>`<div class="row" style="padding:10px 0;border-top:1px solid var(--line)"><div><b>${esc(l.name)}</b><br><span class="mut sm">${esc(l.company)}</span></div><input class="inp" id="e_${l.id}" placeholder="${l.email?'Email on file':'Verified email'}" ${l.email?'disabled':''}><input class="inp" id="p_${l.id}" placeholder="${l.phone?'Phone on file':'Verified phone'}" ${l.phone?'disabled':''}><select class="inp" id="c_${l.id}"><option value="">Consent source…</option><option>Provided by the contact</option><option>Opt-in form</option><option>Licensed provider</option><option>CRM record with consent</option></select><button class="btn sm g" onclick="A.enr('${l.id}')">Save</button></div>`).join(''):'<div class="empty">All leads have email and phone.</div>'}</div>`};
A.enr=async id=>{const l=S.leads.find(x=>x.id==id),e=$('#e_'+id).value.trim(),p=$('#p_'+id).value.trim(),c=$('#c_'+id).value;if(!e&&!p)return toast('Enter a verified value');if(!c)return toast('Choose the consent source');if(e&&!EM.test(e))return toast('Invalid email');
const n={...l};if(e)n.email=e;if(p)n.phone=p;n.consent=c;score(n);if(e&&S.leads.some(x=>x.id!=id&&same(n,x)))return toast('Another lead already uses that email');await withBusy(async()=>{await updateLead(id,n);render();toast('Saved with consent record')})};
let E={scope:'all',min:60,fmt:'csv'};
function expText(){let L=S.leads;if(E.scope=='q')L=L.filter(l=>l.score>=S.cfg.q);if(E.scope=='min')L=L.filter(l=>l.score>=E.min);const K=['name','title','company','location','email','phone','linkedin','score','source'];
if(E.fmt=='json')return JSON.stringify(L.map(l=>Object.fromEntries(K.map(k=>[k,l[k]]))),null,2);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return[K.join(','),...L.map(l=>K.map(k=>q(l[k])).join(','))].join('\n')}
V.export=()=>`<div class="card"><h3>Export leads</h3><div class="row"><div><label>Scope</label><select class="inp" onchange="E.scope=this.value;A.ex()"><option value="all" ${E.scope=='all'?'selected':''}>All leads</option><option value="q" ${E.scope=='q'?'selected':''}>Qualified (≥ ${S.cfg.q})</option><option value="min" ${E.scope=='min'?'selected':''}>Custom minimum score</option></select></div><div><label>Min score</label><input class="inp" type="number" value="${E.min}" onchange="E.min=+this.value;A.ex()"></div><div><label>Format</label><select class="inp" onchange="E.fmt=this.value;A.ex()"><option value="csv" ${E.fmt=='csv'?'selected':''}>CSV</option><option value="json" ${E.fmt=='json'?'selected':''}>JSON</option></select></div></div><p class="mut sm" id="ec" style="margin:12px 0"></p><textarea class="inp" id="ex" readonly style="min-height:260px"></textarea><div class="row" style="margin-top:12px"><button class="btn g" onclick="A.copy()">Copy to clipboard</button><button class="btn" onclick="A.dl()">Download file</button></div><p class="mut sm" style="margin-top:10px">If downloads are blocked in the preview, use Copy and paste into a file.</p></div>`;
A.ex=()=>{const t=expText();$('#ex').value=t;$('#ec').textContent=(E.fmt=='csv'?t.split('\n').length-1:JSON.parse(t).length)+' leads in export'};
A.copy=()=>{const t=$('#ex');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>{document.execCommand('copy');toast('Copied')})}catch(e){document.execCommand('copy');toast('Copied')}};
A.dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([expText()],{type:'text/plain'}));a.download='leadbridge-export.'+E.fmt;a.click();toast('Download started')};
V.account=()=>`<div class="grid g2"><div class="card"><h3>Profile</h3><label>Name</label><input class="inp" id="sn" value="${esc(S.user.name)}"><label>Email (sign-in)</label><input class="inp" value="${esc(S.user.email)}" disabled><div class="row" style="margin-top:14px"><button class="btn g" onclick="A.prof()">Save profile</button><button class="btn" onclick="A.logout()">Log out</button></div></div>
<div class="card"><h3>Your data</h3><p class="mut sm">${S.leads.length} leads are stored in your Supabase database. Row Level Security limits every read and write to your own account. Scoring settings and import history are kept in this browser.</p><div class="row" style="margin-top:12px"><button class="btn d" onclick="A.wipe()">Delete all my leads</button></div></div></div>
<div class="card"><h3>Compliance principles</h3><ul style="padding-left:18px;display:grid;gap:6px" class="sm"><li>No scraping of LinkedIn or any site; no bypassing access controls. LinkedIn URLs are only format-checked.</li><li>No private contact data without authorization; consent source is recorded on enrichment.</li><li>No invented emails or phone numbers. Sample leads use reserved <code>.example</code> domains and 555 numbers.</li><li>Scoring is a transparent rule-based points system, not machine learning.</li></ul></div>`;
A.prof=async()=>{const n=$('#sn').value.trim();if(!n)return toast('Enter a name');await withBusy(async()=>{const{error}=await sb.auth.updateUser({data:{full_name:n}});if(error)throw error;S.user.name=n;render();toast('Profile saved')})};
A.wipe=async()=>{if(!confirm('Permanently delete ALL your leads? This cannot be undone.'))return;await withBusy(async()=>{const{error}=await sb.from('leads').delete().eq('owner_id',S.user.id);if(error)throw error;S.leads=[];D.sel.clear();render();toast('All your leads were deleted')})};
/* ===== Router ===== */
function render(){let r=location.hash.slice(1)||'home';if(!V[r])r='home';const app=$('#app');if(!S.ready){app.innerHTML='<div class="auth"><div class="spin"></div></div>';return}if(S.user&&(r=='login'||r=='signup'))r='dash';if(APP.includes(r)&&!S.user)r='login';
if(APP.includes(r)){const t=NAV.find(n=>n[0]==r);app.innerHTML=`<div class="shell"><aside class="side" id="side"><div class="logo">${LOGO}</div><nav>${NAV.map(n=>`<button class="${n[0]==r?'on':''}" onclick="A.go('${n[0]}');$('#side').classList.remove('open')">${n[2]} ${n[1]}</button>`).join('')}</nav><div class="sm mut" style="padding:6px 10px">${esc(S.user.name)}<br>${esc(S.user.email)}<br><button class="btn sm" style="margin-top:8px" onclick="A.logout()">Log out</button></div></aside><main><header class="top"><button class="btn sm menu" onclick="A.menu()">☰</button><h1>${t[1]}</h1><button class="btn g sm" onclick="A.go('linkedin')">+ Import leads</button></header><section class="view">${V[r]()}</section></main></div>`;
if(r=='export')A.ex();prev()}else app.innerHTML=V[r]();
document.querySelectorAll('[data-n]').forEach(el=>{const to=+el.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700);el.textContent=Math.round(to*p);if(p<1)requestAnimationFrame(f)})(t0)});scrollTo(0,0)}
addEventListener('hashchange',render);
['lb_leads','lb_user','lb_imports','lb_cfg'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}}); /* remove old demo data */
if(sb)sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(async()=>{if(ev=='SIGNED_OUT'&&S.user){S.user=null;S.leads=[];location.hash='login';render()}else if(ev=='SIGNED_IN'&&sess&&S.ready&&!S.user&&!S.starting){S.starting=true;await startSession(sess.user);S.starting=false;location.hash='dash';render()}},0)});
(async()=>{render();if(sb){try{const{data}=await sb.auth.getSession();if(data.session)await startSession(data.session.user)}catch(e){console.error(e);toast(fe(e))}}S.ready=true;render()})();
</script></body></html>
